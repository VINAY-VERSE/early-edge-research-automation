name: Early Edge Research Pipeline

on:
  workflow_dispatch: {}

jobs:
  collect-bse:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Collect BSE announcements
        run: |
          python bse_collector.py

           - name: Save BSE data
        run: |
          git config user.name "research-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update BSE announcements"
          git push
