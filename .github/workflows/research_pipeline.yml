name: Early Edge Research Pipeline

on:
  workflow_dispatch: {}

jobs:
  collect-bse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Collect BSE announcements
        run: |
          python - <<'PY'
          import feedparser

          url = "https://beta.bseindia.com/data/xml/announcements.xml"

          feed = feedparser.parse(url)

          print(f"Total items found: {len(feed.entries)}")
          print("=" * 80)

          for item in feed.entries[:10]:
              print("Company:", item.get("title", ""))
              print("URL:", item.get("link", ""))
              print("Date:", item.get("published", ""))
              print("Description:", item.get("description", ""))
              print("-" * 80)
          PY
