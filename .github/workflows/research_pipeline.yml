name: Early Edge Research Pipeline

on:
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Test BSE RSS
        run: python -c "import feedparser; feed=feedparser.parse('BSE_RSS_URL_HERE'); print('Items found:', len(feed.entries)); [print(e.get('title'), e.get('link')) for e in feed.entries[:5]]"
